# PLC Discovery Tool - Docker Compose Configuration
# 
# Usage:
#   docker-compose up -d simulators    # Start simulators only
#   docker-compose up scanner          # Run scanner (one-time)
#   docker-compose up -d               # Start all services
#   docker-compose run scanner --mode discover  # Run with custom args

services:
  # =========================================
  # PLC Scanner Service
  # =========================================
  scanner:
    build:
      context: .
      target: production
    container_name: plc-scanner
    volumes:
      # Output directory
      - ./plc_scan_results:/app/output
      # Configuration files
      - ./plc_config.yaml:/app/config.yaml:ro
      - ./type_mapping.json:/app/type_mapping.json:ro
    environment:
      - TZ=Asia/Tokyo
    networks:
      - plc-network
    depends_on:
      - simulators
    # Scan the simulators (note the non-standard simulator ports):
    #   docker-compose run scanner --mode range --target simulators --protocol modbus --port 1502 --device HR --range 0-99
    #   docker-compose run scanner --mode range --target simulators --protocol fins-tcp --device DM --range 0-99
    #
    # Real factory LAN: discovery uses broadcast/ARP, which does not leave a
    # bridge network. Use the host network instead (Linux only) and remove
    # "networks"/"depends_on" above:
    #   network_mode: host
    #
    # Note: the config/type-mapping files below must exist on the host,
    # otherwise Docker creates empty directories in their place.

  # =========================================
  # PLC Simulators Service
  # =========================================
  simulators:
    build:
      context: .
      target: simulator
    container_name: plc-simulators
    # Ports used by simulators/run_all.py (non-privileged where the standard
    # port is < 1024): connect with e.g. --protocol modbus --port 1502
    # Published on the host's loopback only, so the fake PLCs are not visible
    # on the plant network (remove "127.0.0.1:" to expose them to other PCs)
    ports:
      # SLMP Simulator
      - "127.0.0.1:5001:5001"
      # Modbus/TCP Simulator (standard 502)
      - "127.0.0.1:1502:1502"
      # EtherNet/IP Simulator
      - "127.0.0.1:44818:44818"
      # S7 Simulator (standard 102)
      - "127.0.0.1:1102:1102"
      # FINS Simulator (UDP and TCP)
      - "127.0.0.1:9600:9600/udp"
      - "127.0.0.1:9600:9600/tcp"
    environment:
      - TZ=Asia/Tokyo
    networks:
      - plc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 5001)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =========================================
  # Development/Test Service
  # =========================================
  dev:
    build:
      context: .
      target: development
    container_name: plc-dev
    volumes:
      - .:/app
      - ./plc_scan_results:/app/output
    environment:
      - TZ=Asia/Tokyo
    networks:
      - plc-network
    depends_on:
      - simulators
    command: ["python", "-m", "pytest", "tests/", "-v", "-m", "not integration"]

  # =========================================
  # Integration Test Service
  # =========================================
  integration-test:
    build:
      context: .
      target: development
    container_name: plc-integration-test
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Tokyo
      - SLMP_HOST=simulators
      - MODBUS_HOST=simulators
    networks:
      - plc-network
    depends_on:
      simulators:
        condition: service_healthy
    command: ["python", "-m", "pytest", "tests/integration/", "-v", "-m", "integration"]

networks:
  plc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Named volumes for persistent data
volumes:
  scan-results:
    driver: local


