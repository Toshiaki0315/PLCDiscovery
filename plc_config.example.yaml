# PLC Discovery Tool - Configuration File Example
# Copy this file to plc_config.yaml and customize for your environment

version: "1.0"

# Network communication settings
network:
  # Timeout for discovery responses (milliseconds)
  discovery_timeout_ms: 1000
  
  # Number of retries for discovery
  discovery_retry_count: 3
  
  # Interval between packets to avoid network overload (milliseconds)
  packet_interval_ms: 50
  
  # Interval before retry on error (milliseconds)
  retry_interval_ms: 200
  
  # Single request timeout (milliseconds)
  request_timeout_ms: 5000
  
  # Maximum concurrent PLC connections
  max_concurrent: 3

# Discovery settings
discovery:
  enabled: true
  
  # Scan the same network segment automatically
  scan_same_segment: true
  
  # Additional IP ranges to scan (CIDR or hyphen notation)
  ip_ranges:
    # - "192.168.1.0/24"
    # - "10.0.0.1-100"
  
  # Protocols to probe during discovery (remove entries to skip them and
  # shorten discovery; --discover-protocols on the command line overrides)
  protocols:
    - slmp
    - ethernet_ip
    - modbus
    - s7
    - fins        # FINS/UDP
    - fins_tcp    # FINS/TCP

# Target PLCs for direct connection (skip discovery)
targets:
  # Example: Mitsubishi PLC
  # - ip: "192.168.1.10"
  #   protocol: slmp
  #   port: 5001
  #   name: "Main PLC"
  #   manufacturer: "三菱電機"
  
  # Example: Omron PLC
  # - ip: "192.168.1.20"
  #   protocol: ethernet_ip
  #   port: 44818
  #   name: "Sub PLC"
  #   manufacturer: "オムロン"
  
  # Example: Modbus device
  # - ip: "192.168.1.30"
  #   protocol: modbus
  #   port: 502
  #   name: "Sensor Unit"
  
  # Example: FINS (Omron)  protocol: fins = FINS/UDP, fins_tcp = FINS/TCP
  # - ip: "192.168.1.40"
  #   protocol: fins
  #   port: 9600
  #   name: "Legacy Omron PLC"
  #   # Optional protocol-specific settings (protocol must be given):
  #   #   fins / fins_tcp: dest_node (default: last IP octet), source_node
  #   #   s7: rack, slot, db_number    ethernet_ip: slot    modbus: unit_id
  #   options:
  #     dest_node: 40

# Scan settings
scan:
  # Mode: "range" (production-safe: reads only device_ranges), "discover",
  # or "full" (factory downtime only: reads every device range, heavy traffic)
  mode: range
  
  # Device ranges to scan (for range mode)
  device_ranges:
    - device: D
      start: 0
      end: 8191
    - device: M
      start: 0
      end: 8191
    # - device: W
    #   start: 0
    #   end: 2047
  
  # EtherNet/IP tags (Logix) / variables (Omron NJ/NX) to read in range mode
  # (same as --tags). "Name[0]{10}" = 10 array elements; structure members
  # as "Name.Member"; program tags as "Program:MainProgram.Step".
  # tags:
  #   - Temperature
  #   - Motor
  #   - Values[0]{10}
  #
  # Members of structure variables, for controllers that cannot report a
  # structure's layout (Omron NJ/NX): "Motor" above is read as Motor.Speed,
  # Motor.Current and Motor.Count ("Motors[0]{2}" as Motors[0].Speed, ...)
  # tag_members:
  #   Motor: [Speed, Current, Count]
  
  # Interval for continuous scanning (0 = single scan)
  interval_seconds: 0

# Output settings
output:
  # Output directory for result files
  directory: "./plc_scan_results"
  
  # CSV encoding:
  #   utf-8-sig = UTF-8 with BOM, opens correctly in Excel (recommended)
  #   utf-8     = UTF-8 without BOM (for other tools)
  #   shift-jis = CP932; characters it cannot represent are written as "?"
  encoding: utf-8-sig
  
  # Output format: "csv" or "json"
  format: csv
  
  # Include timestamp in filenames
  include_timestamp: true
  
  # SQLite database output (optional)
  database:
    # Enable/disable database output
    enabled: false
    
    # Database file path
    path: "./plc_data.db"
    
    # Track value changes
    track_history: true
    
    # Days of data to keep: older rows are deleted when the database is
    # opened and every cleanup_interval_hours during periodic scans
    # (0 = keep everything)
    max_history_days: 30
    
    # Upper limit of the data in MB: the oldest rows are deleted until it
    # fits; the latest value of every address is kept (0 = no limit)
    max_size_mb: 0
    
    # How often a periodic scan applies the two limits above (hours)
    cleanup_interval_hours: 24

# Logging settings
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: INFO
  
  # Log file path (optional, null for console only)
  file: null
  
  # Audit log file path (for compliance/tracking)
  audit_log: "./plc_scan_results/audit.log"
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Data type conversion settings
data_types:
  # Default data type for addresses without specific mapping
  default_type: WORD
  
  # Default byte order for multi-word values (words AB=high, CD=low):
  #   little=CDAB (low word first), big=ABCD,
  #   little_swap=DCBA, big_swap=BADC (bytes swapped inside each word)
  default_byte_order: little
  
  # Address-specific type mappings
  #   device: limits the mapping to one device type (D, DM, HR, ...).
  #           Without it, a mapping applies to word devices only (never M/X/Y/B/SM).
  #   Multi-word types are paired from "start": FLOAT at 100 -> 100-101, 102-103, ...
  mappings:
    # Temperature sensors (D100-D199) as FLOAT
    - device: D
      start: 100
      end: 199
      type: FLOAT
      byte_order: little
      description: "Temperature sensors"
    
    # Pressure sensors (D200-D299) as FLOAT
    - device: D
      start: 200
      end: 299
      type: FLOAT
      description: "Pressure sensors"
    
    # Production counters (D300-D399) as DWORD
    - start: 300
      end: 399
      type: DWORD
      description: "Production counters"
    
    # Signed values (D400-D499) as INT16
    - start: 400
      end: 499
      type: INT16
      description: "Signed integer values"

# Notification settings
# Notification timing (minutes, 0 = off)
notification_settings:
  # During a periodic scan, send a status report (OK/NG per PLC) this often
  report_interval_minutes: 0
  # Send each event type at most once in this many minutes (repeats are
  # dropped), so a PLC failing every cycle does not flood the channel
  min_interval_minutes: 0

# Event types: scan_complete, scan_error, discovery_complete, status_report,
# plc_unreachable (periodic scan: a PLC stopped answering, and when it
# answers again; also sent to destinations that chose scan_error),
# threshold_exceeded (periodic scan: a value crossed a limit in thresholds)
notifications:
  # Webhook notification
  - name: main_webhook
    type: webhook
    url: "https://your-server.com/api/plc-notifications"
    enabled: false  # Set to true to enable
    events:
      - scan_complete
      - scan_error
    headers:
      Authorization: "Bearer your-token"
  
  # Slack notification
  - name: slack_alerts
    type: slack
    url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
    enabled: false
    events:
      - scan_error
      - discovery_complete
  
  # Microsoft Teams notification: the webhook URL of a Teams workflow
  # ("Post to a channel when a webhook request is received"; the old
  # Office 365 connector URLs are retired)
  - name: teams_alerts
    type: teams
    url: "https://YOUR-WORKFLOW-WEBHOOK-URL"
    # Message format: adaptive (Adaptive Card, default, for workflow
    # webhooks) or messagecard (legacy Office 365 connector URLs)
    format: adaptive
    enabled: false
    events:
      - scan_complete

# Thresholds watched during periodic range scans (--interval): a
# threshold_exceeded notification is sent once when a value crosses its
# limit, and again only after it went back inside. Operators: > >= < <= == !=
# (CLI: --threshold "D100>80")
# thresholds:
#   - address: D100
#     op: ">"
#     value: 80
#     name: Furnace temperature
