[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-discovery"
# Single source of truth: plc_discovery.__version__
dynamic = ["version"]
description = "Multi-vendor PLC auto-detection and data collection tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PLC Discovery Team"}
]
keywords = ["plc", "factory", "automation", "slmp", "modbus", "ethernet/ip", "s7"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

dependencies = [
    "pymcprotocol>=0.3.0",   # latest release on PyPI is 0.3.0
    "pycomm3>=1.2.0",        # SLCDriver / ListIdentity used by the EtherNet/IP handler
    "pymodbus>=3.0.0",
    "python-snap7>=1.4.0",
    "scapy>=2.5.0",
    "PyYAML>=6.0",           # YAML config and type mapping files
]

[project.optional-dependencies]
rich = [
    "rich>=13.0.0",          # optional rich console output (plain output without it)
]
net = [
    "netifaces>=0.11.0",     # exact subnet for discovery (/24 assumed without it);
                             # no Windows wheels for Python 3.10+
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "flake8>=6.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[project.scripts]
plc-scanner = "plc_scanner:cli"

[project.urls]
"Homepage" = "https://github.com/your-org/plc-discovery"
"Bug Tracker" = "https://github.com/your-org/plc-discovery/issues"

[tool.setuptools]
# Top-level scripts imported by the console entry point
py-modules = ["plc_scanner", "plc_gui"]

[tool.setuptools.dynamic]
version = {attr = "plc_discovery.__version__"}

[tool.setuptools.packages.find]
include = ["plc_discovery*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["plc_discovery"]
skip = [".git", ".venv", "venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "pymcprotocol.*",
    "pycomm3.*",
    "pymodbus.*",
    "snap7.*",
    "scapy.*",
    "netifaces.*",
    "rich.*",
    "weasyprint.*",
    "pdfkit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["plc_discovery"]
branch = true
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

