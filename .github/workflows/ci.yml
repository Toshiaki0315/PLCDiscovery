name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Unit tests (fast, no external dependencies)
  unit-test:
    runs-on: ubuntu-latest
    # No job runs for long; without a limit a hung step holds it for 6 hours
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run unit tests with coverage
      # Minimum a few points below the coverage reached (88% in Nov 2026):
      # a change that brings much code without tests fails here.
      # Keep scripts/check.py in step
      run: |
        pytest tests/ -v -m "not integration" \
          --cov=plc_discovery \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=85
      # A test that never ends must fail the job, not hold it for 6 hours
      timeout-minutes: 15
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v7
      if: matrix.python-version == '3.11'
      with:
        name: coverage-report
        path: htmlcov/
    
    # Codecov takes uploads with a token only: without the repository
    # secret CODECOV_TOKEN (or on a fork's pull request, which gets no
    # secrets) the upload is skipped instead of failing in every run.
    # The coverage minimum above and the HTML report do not need it.
    - name: Check for the Codecov token
      id: codecov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        if [ -n "$CODECOV_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

    - name: Upload coverage to Codecov
      if: steps.codecov.outputs.enabled == 'true'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml   # "file" was renamed to "files" in v5
        flags: unittests
        name: codecov-umbrella-${{ matrix.python-version }}
        fail_ci_if_error: false

  # Integration tests (with simulators)
  integration-test:
    runs-on: ubuntu-latest
    # No job runs for long; without a limit a hung step holds it for 6 hours
    timeout-minutes: 20
    needs: unit-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    # tests/integration/conftest.py starts and stops the simulators itself
    # (with the denied ranges the tests expect). Starting run_all.py here as
    # well took the same ports, so the tests talked to differently configured
    # simulators. (A per-test time limit comes from pytest.ini / pytest-timeout.)
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m integration --tb=short
      timeout-minutes: 5

  # Data type tests (specific validation)
  data-type-test:
    runs-on: ubuntu-latest
    # No job runs for long; without a limit a hung step holds it for 6 hours
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run data type conversion tests
      run: |
        pytest tests/test_data_types.py -v --tb=short

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    # No job runs for long; without a limit a hung step holds it for 6 hours
    timeout-minutes: 20
    env:
      # Entry-point scripts at the repository root, checked like the package
      TOP_LEVEL: plc_scanner.py plc_gui.py plc_gui_settings.py plc_gui_tags.py
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinned: a new release may add checks; bump together with a local run
        pip install black==26.5.1 isort==6.0.1 flake8==7.3.0 mypy==1.18.1
    
    - name: Run linting with flake8
      run: |
        flake8 plc_discovery tests simulators scripts $TOP_LEVEL --max-line-length=120 --ignore=E501,W503,E402,E203,E704
    
    - name: Check code formatting with Black
      run: |
        black --check --diff plc_discovery tests simulators scripts $TOP_LEVEL
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff plc_discovery tests simulators scripts $TOP_LEVEL
    
    - name: Run type checking with mypy
      run: |
        mypy plc_discovery simulators scripts $TOP_LEVEL --ignore-missing-imports --no-error-summary

  # Build package
  build:
    runs-on: ubuntu-latest
    # No job runs for long; without a limit a hung step holds it for 6 hours
    timeout-minutes: 20
    needs: [unit-test, data-type-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # Test CLI functionality
  cli-test:
    runs-on: ubuntu-latest
    # No job runs for long; without a limit a hung step holds it for 6 hours
    timeout-minutes: 20
    needs: unit-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test CLI help
      run: |
        python plc_scanner.py --help
    
    - name: Test config generation
      run: |
        python plc_scanner.py --generate-config
        test -f plc_config.yaml
    
    - name: Validate generated config
      run: |
        python -c "
        import yaml
        with open('plc_config.yaml') as f:
            config = yaml.safe_load(f)
        assert 'version' in config
        assert 'network' in config
        print('Config validation passed')
        "
