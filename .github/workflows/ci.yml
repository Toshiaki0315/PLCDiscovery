name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Unit tests (fast, no external dependencies)
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run unit tests with coverage
      run: |
        pytest tests/ -v -m "not integration" \
          --cov=plc_discovery \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=60
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v7
      if: matrix.python-version == '3.11'
      with:
        name: coverage-report
        path: htmlcov/
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml   # "file" was renamed to "files" in v5
        flags: unittests
        name: codecov-umbrella-${{ matrix.python-version }}
        fail_ci_if_error: false

  # Integration tests (with simulators)
  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    # tests/integration/conftest.py starts and stops the simulators itself
    # (with the denied ranges the tests expect). Starting run_all.py here as
    # well took the same ports, so the tests talked to differently configured
    # simulators. "--timeout" needs pytest-timeout, which is not installed:
    # the step failed at once, hidden by continue-on-error.
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m integration --tb=short
      timeout-minutes: 5

  # Data type tests (specific validation)
  data-type-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run data type conversion tests
      run: |
        pytest tests/test_data_types.py -v --tb=short

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
    
    - name: Run linting with flake8
      run: |
        flake8 plc_discovery tests simulators --max-line-length=120 --ignore=E501,W503,E402
      continue-on-error: true
    
    - name: Check code formatting with Black
      run: |
        black --check --diff plc_discovery tests
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff plc_discovery tests
      continue-on-error: true
    
    - name: Run type checking with mypy
      run: |
        mypy plc_discovery --ignore-missing-imports --no-error-summary
      continue-on-error: true

  # Build package
  build:
    runs-on: ubuntu-latest
    needs: [unit-test, data-type-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # Test CLI functionality
  cli-test:
    runs-on: ubuntu-latest
    needs: unit-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test CLI help
      run: |
        python plc_scanner.py --help
    
    - name: Test config generation
      run: |
        python plc_scanner.py --generate-config
        test -f plc_config.yaml
    
    - name: Validate generated config
      run: |
        python -c "
        import yaml
        with open('plc_config.yaml') as f:
            config = yaml.safe_load(f)
        assert 'version' in config
        assert 'network' in config
        print('Config validation passed')
        "
