[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
# pytest-timeout: a test that never ends (a task whose cancellation was lost,
# a polling loop without a deadline) fails with a traceback after this many
# seconds instead of holding the run until the CI step is killed
timeout = 120
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test (requires simulators)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

